cradle:
  multi:
    - path: "data"
      config: { cradle: { none: }}
    - path: "region-tests"
      config: { cradle: { none: }}

    - path: "."
      config:
        cradle:
          cabal:
            - path: "src"
              component: "lib:4h"

            - path: "app"
              component: "4h:exe:4h"

            - path: "tests"
              component: "4h:test:tests"
